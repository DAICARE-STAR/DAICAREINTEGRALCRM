# Fallback de SPA (los archivos estáticos existentes se sirven primero)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad de todo el sitio. El CSP completo del shell viaja
# como <meta> en index.html (lo inyecta vite.config.ts); aquí va solo
# frame-ancestors, que únicamente funciona como cabecera, y X-Frame-Options
# como equivalente para navegadores viejos.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self'"
