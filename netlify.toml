# Configuración de build y seguridad para Netlify (una instalación por cliente).
# Modelo: team-portal/netlify.toml con las cabeceras de hardening (hash en docs/origen.md).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 y Vitest 5 piden Node 20.19+ o 22.12+: se fija para que el build no
  # dependa de la versión por defecto de la imagen de Netlify.
  NODE_VERSION = "22"
  # .env.example es una plantilla sin valores: excluirla del escáner de secretos
  # evita falsos positivos.
  SECRETS_SCAN_OMIT_PATHS = ".env.example"
  # Valores públicos POR DISEÑO (van al bundle del navegador a propósito): la
  # URL del proyecto Supabase, la clave anónima (protegida por RLS) y el nombre
  # visible del portal. Los secretos reales siguen vigilados por el escáner.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_PORTAL_NOMBRE"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Las llamadas del frontend a /api/* se enrutan a las Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Rutas internas del repo: 404 forzado antes del fallback SPA, para que nunca
# respondan el shell con 200. publish = dist ya las deja fuera; esto evita que
# el fallback las disimule.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

